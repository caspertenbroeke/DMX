# Spotify-geluid via de beat-luisteraar: die analyseert de muziek en speelt hem 4 seconden later af op de
# geluidskaart. Zo weet de lichtshow vooraf waar de beats en drops vallen (en bouwt hij op naar een drop).
[Service]
ExecStart=
ExecStart=/bin/sh -c '/usr/bin/librespot | /usr/bin/python3 -u /usr/local/lib/zeutekauwn/beatluister.py spotify --voorsprong 4'
Restart=always
RestartSec=2
