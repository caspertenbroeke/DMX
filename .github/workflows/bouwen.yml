name: DMXDesk bouwen

# Bij elke push: testen en de app bouwen voor Windows, macOS en Linux (te downloaden onder "Artifacts").
# Bij een versie-tag (bijv. v2.0.0): ook een GitHub-release maken met de downloads.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pyserial pytest
      - run: python -m pytest -q

  bouwen:
    needs: testen
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            naam: windows
          - os: macos-latest
            naam: macos-apple-silicon
          - os: macos-15-intel
            naam: macos-intel
          - os: ubuntu-22.04
            naam: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Systeempakketten (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libasound2-dev
      - name: Python-pakketten
        run: pip install -r packaging/requirements-app.txt pyinstaller pillow
      - name: App bouwen
        run: python packaging/bouw.py ${{ matrix.naam }}
      - name: Windows-installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { choco install innosetup --no-progress -y | Out-Null; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $versie = python -c "import dmxdesk; print(dmxdesk.VERSIE)"
          & $iscc "/DVersie=$versie" "/DUitvoer=..\dist\uitvoer" packaging\windows-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: DMXDesk-${{ matrix.naam }}
          path: dist/uitvoer/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bouwen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: downloads/*
          generate_release_notes: true
