[package]
name = "dmxdesk-spotify"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Spotify Connect-speaker voor DMXDesk (op basis van librespot)"
publish = false

[dependencies]
librespot-core = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-connect = { version = "=0.8.0", default-features = false }
librespot-discovery = { version = "=0.8.0", default-features = false, features = ["with-libmdns"] }
librespot-playback = { version = "=0.8.0", default-features = false }
librespot-metadata = { version = "=0.8.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
sha1 = "0.10"
serde_json = "1"
futures-util = { version = "0.3", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
