<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0c0c">
<title>Zeutekauwn DMXDesk</title>
<style>
  :root { --bg: #0c0c0c; --vlak: #151515; --vlak2: #1f1f22; --rand: #2c2c2e; --tekst: #f2f2f2; --zacht: #8e8e93;
          --accent: #ffcc00; --rood: #ff453a; --groen: #30d158; --blauw: #5ac8fa; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tekst); font: 14px/1.4 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: #000; border-bottom: 1px solid var(--rand);
           padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  header h1 { font-size: 16px; margin: 0; color: var(--accent); letter-spacing: 1px; }
  header .st { display: flex; gap: 12px; align-items: center; color: var(--zacht); font-size: 13px; flex-wrap: wrap; }
  header a { color: var(--zacht); margin-left: auto; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--rood); margin-right: 4px; vertical-align: -1px; }
  .dot.ok { background: var(--groen); }
  .beat { width: 12px; height: 12px; border-radius: 50%; background: #333; display: inline-block; vertical-align: -2px; }
  .beat.aan { background: var(--accent); }
  .pil { padding: 1px 8px; border-radius: 10px; background: #333; color: #fff; font-weight: 700; font-size: 12px; }
  nav { display: flex; gap: 6px; padding: 10px 12px 0; overflow-x: auto; }
  nav button { flex: 1; min-width: 90px; }
  nav button.actief { background: var(--accent); color: #000; border-color: var(--accent); }
  main { padding: 12px; max-width: 1200px; margin: 0 auto; }
  .raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
  .blok { background: var(--vlak); border: 1px solid var(--rand); border-radius: 10px; padding: 12px; }
  .blok h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); }
  .blok h3 { margin: 12px 0 6px; font-size: 12px; color: var(--zacht); text-transform: uppercase; }
  button { background: var(--vlak2); color: var(--tekst); border: 1px solid var(--rand); border-radius: 8px;
           padding: 10px 8px; font-weight: 700; font-size: 13px; cursor: pointer; touch-action: manipulation; }
  button:hover { border-color: #555; }
  button.aan { background: var(--accent); color: #000; border-color: var(--accent); }
  button.gevaar { color: var(--rood); border-color: #5a1f1f; }
  button.groot { font-size: 18px; padding: 14px; }
  button.primair { background: var(--accent); color: #000; border-color: var(--accent); }
  .knoppen { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
  .rij { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  .rij > label { width: 110px; color: var(--zacht); flex-shrink: 0; }
  .rij input[type=range] { flex: 1; }
  .rij .waarde { width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { accent-color: var(--accent); height: 28px; }
  input, select { background: var(--vlak2); color: var(--tekst); border: 1px solid var(--rand); border-radius: 6px;
                  padding: 7px 8px; font-size: 14px; }
  input[type=number] { width: 72px; }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); vertical-align: middle; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .swatch { width: 40px; height: 40px; border-radius: 8px; border: 2px solid #333; position: relative; cursor: pointer; }
  .swatch.aan { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
  .swatch span { position: absolute; top: 2px; right: 4px; font-size: 11px; font-weight: 900; color: #000;
                 text-shadow: 0 0 3px #fff; }
  .bpm { font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; min-width: 110px; text-align: center; }
  .hint { color: var(--zacht); font-size: 12px; margin: 6px 0; }
  .meter { height: 12px; background: #222; border-radius: 6px; overflow: hidden; margin-top: 10px; }
  #eMeter { height: 100%; width: 0; background: linear-gradient(90deg, var(--groen), var(--accent), var(--rood)); transition: width .2s linear; }
  .fout { color: var(--rood); }
  .kaart { background: var(--vlak); border: 1px solid var(--rand); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .kaart .kop { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .kaart .kop input { flex: 1; font-weight: 700; }
  .velden { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 12px; }
  .velden label { display: flex; flex-direction: column; gap: 3px; color: var(--zacht); font-size: 12px; }
  .velden label.check { flex-direction: row; align-items: center; gap: 6px; color: var(--tekst); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--zacht); font-size: 11px; font-weight: 600; padding: 4px; text-transform: uppercase; }
  td { padding: 3px 4px; }
  td input:not([type=checkbox]), td select { width: 100%; }
  .scroll { overflow-x: auto; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #222; border: 1px solid var(--accent);
           padding: 10px 16px; border-radius: 8px; z-index: 10; display: none; max-width: 90vw; }
  .toast.fout { border-color: var(--rood); color: var(--rood); }
  .testrij { display: grid; grid-template-columns: 170px 1fr 64px 48px; gap: 8px; align-items: center; margin: 4px 0; }
  .testrij .naam { color: var(--zacht); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .testrij .live { color: var(--blauw); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  @media (max-width: 560px) {
    .raster { grid-template-columns: 1fr; }
    .rij > label { width: 84px; }
    .testrij { grid-template-columns: 110px 1fr 58px 36px; }
  }
</style>
</head>
<body>
<header>
  <h1>ZEUTEKAUWN DMXDESK</h1>
  <div class="st">
    <span><span class="dot" id="dDot"></span><span id="dTekst">…</span></span>
    <span><span class="beat" id="beat"></span> <b id="hBpm">–</b> BPM</span>
    <span class="pil" id="hSmoke" style="display:none;background:#5ac8fa;color:#000">SMOKE</span>
    <span class="pil" id="hStrobe" style="display:none;background:#fff;color:#000">STROBE</span>
    <span class="pil" id="hAuto" style="display:none;background:var(--groen);color:#000">AUTO</span>
    <span class="pil" id="hTest" style="display:none;background:var(--rood)">TEST</span>
  </div>
  <a href="/">telefoonpagina</a>
</header>
<nav id="tabs">
  <button data-tab="show" class="actief">Show</button>
  <button data-tab="scenes">Scènes</button>
  <button data-tab="fixtures">Fixtures</button>
  <button data-tab="profielen">Profielen</button>
  <button data-tab="test">Test</button>
</nav>
<main id="inhoud"></main>
<div class="toast" id="toast"></div>

<script>
// ------------------------------------------------------------------ basis
let S = null;            // laatste toestand van de Pi
let tab = 'show';
let bezig = false;       // gebruiker sleept aan een schuif: niet opnieuw tekenen
let F = null, P = null, profielKeuze = null, testFixture = null, testWaarden = [];
const inhoud = document.getElementById('inhoud');

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const kloon = o => JSON.parse(JSON.stringify(o));

async function api(url, body) {
  const opt = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  const r = await fetch(url, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.fout || ('fout ' + r.status));
  return j;
}

function toast(tekst, fout = false) {
  const t = document.getElementById('toast');
  t.textContent = tekst; t.className = 'toast' + (fout ? ' fout' : ''); t.style.display = 'block';
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = 'none', fout ? 5000 : 1800);
}

async function laad() {
  try { S = await api('/api/state'); } catch (e) { return; }
  if (!bezig && !piGaatUit) {
    if (tab === 'show') tekenShow();
    if (tab === 'scenes') tekenScenes();
  }
  toonStatus(S.status);   // ná het tekenen, anders wist het opnieuw tekenen de energiemeter meteen weer
}

function pad(p, v) {
  const keys = p.split('.'), obj = {}; let o = obj;
  keys.slice(0, -1).forEach(k => o = o[k] = {});
  o[keys[keys.length - 1]] = v;
  return obj;
}
async function zetShow(p, v, herladen = true) {
  try { await api('/api/show', pad(p, v)); } catch (e) { toast(e.message, true); }
  if (herladen) laad();
}

// ------------------------------------------------------------------ status
let beatInfo = { beat: 0, bpm: 120, t: 0 };
const BRONNAAM = { spotify: 'Spotify', mpd: 'mp3 (MPD)' };
function luisterTekst(s) {
  const bronnen = Object.entries(s.luister || {}).filter(([, i]) => i.muziek);
  if (!bronnen.length) return 'Luistert mee… (hoort nu geen muziek)';
  return bronnen.map(([b, i]) => `Hoort ${BRONNAAM[b] || b}: ${i.dubbel ? Math.round(i.bpm * 20) / 10 : i.bpm} BPM`
      + (i.dubbel ? ' (snel nummer, ×2)' : '') + (i.hoort_beat ? ' ✓ beat gevonden' : ' – zoekt de beat…')
      + (i.noot ? ` · melodie: ${i.noot}` : '')).join(' · ')
    + (s.beat_auto ? '' : ' (handmatig: wordt niet gebruikt)');
}
function toonStatus(s) {
  const li = document.getElementById('luisterInfo'); if (li) li.textContent = luisterTekst(s);
  const bron = Object.values(s.luister || {}).find(i => i.energie !== null && i.energie !== undefined);
  const em = document.getElementById('eMeter'), et = document.getElementById('eTekst');
  if (em && et) {
    const e = bron ? bron.energie : null;
    em.style.width = e === null ? '0%' : Math.round(e * 100) + '%';
    et.textContent = e === null ? 'Hoort nu geen muziek' :
      `Energie ${Math.round(e * 100)}% · ${e < 0.3 ? 'rustig' : e < 0.6 ? 'normaal' : e < 0.8 ? 'druk' : 'EXTREEM'}` + (bron.drop ? ' · 💥 DROP!' : '');
  }
  document.getElementById('hBpm').title = s.beat_auto ? 'automatisch' : 'handmatig';
  document.getElementById('dDot').classList.toggle('ok', s.dongle);
  document.getElementById('dTekst').textContent = s.dongle ? `DMX ok (${s.fps} fps)` : 'geen DMX-dongle';
  document.getElementById('hBpm').textContent = s.bpm;
  document.getElementById('hSmoke').style.display = s.smoke ? '' : 'none';
  document.getElementById('hStrobe').style.display = s.strobe ? '' : 'none';
  document.getElementById('hAuto').style.display = s.auto ? '' : 'none';
  document.getElementById('hTest').style.display = s.test ? '' : 'none';
  beatInfo = { beat: s.beat, bpm: s.bpm, t: performance.now() };
}
async function pollStatus() { try { toonStatus(await api('/api/status')); } catch (e) {
  document.getElementById('dDot').classList.remove('ok'); document.getElementById('dTekst').textContent = 'geen verbinding met de Pi'; } }
function beatLamp() {
  const b = beatInfo.beat + (performance.now() - beatInfo.t) / 1000 * beatInfo.bpm / 60;
  document.getElementById('beat').classList.toggle('aan', (b % 1) < 0.2);
  requestAnimationFrame(beatLamp);
}

// ------------------------------------------------------------------ SHOW
const SNELHEDEN = [[0.25, '¼ beat'], [0.5, '½ beat'], [1, '1 beat'], [2, '2 beats'], [4, '4 beats'], [8, '8 beats'], [16, '16 beats']];
const RONDES = [[2, '2 beats'], [4, '4 beats'], [8, '8 beats'], [16, '16 beats'], [32, '32 beats']];
const KLEUR_MODI = [['vast', 'Vast'], ['wissel', 'Wissel'], ['chase', 'Chase'], ['fade', 'Fade'], ['regenboog', 'Regenboog'], ['random', 'Random'], ['melodie', '♪ Melodie']];
const INT_MODI = [['aan', 'Alles aan'], ['noot_puls', '♪ Puls op melodie'], ['chase', 'Chase'], ['chase_terug', 'Chase terug'], ['pingpong', 'Ping-pong'], ['om_en_om', 'Om en om'],
  ['linksrechts', 'Links/Rechts'], ['binnenbuiten', 'Binnen/Buiten'], ['golf', 'Golf'], ['puls', 'Puls'], ['random', 'Random']];
const BEW_MODI = [['stil', 'Stil'], ['cirkel', 'Cirkel'], ['acht', 'Acht'], ['opneer', 'Op/Neer'], ['linksrechts', 'Links/Rechts'], ['zwaai', 'Zwaai']];
const KLEUREN = [['#ff0000', 'rood'], ['#ff6600', 'oranje'], ['#ffcc00', 'geel'], ['#00ff00', 'groen'], ['#00ffff', 'cyaan'],
  ['#0000ff', 'blauw'], ['#8800ff', 'paars'], ['#ff00ff', 'roze'], ['#ffffff', 'wit']];

const modusKnoppen = (p, modi, huidig) =>
  `<div class="knoppen">${modi.map(([v, t]) => `<button data-set="${p}" data-val='${JSON.stringify(v)}' class="${v === huidig ? 'aan' : ''}">${t}</button>`).join('')}</div>`;
const keuzelijst = (p, opties, huidig) =>
  `<select data-set="${p}" data-num="1">${opties.map(([v, t]) => `<option value="${v}" ${Number(v) === Number(huidig) ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
const schuif = (p, label, waarde, min = 0, max = 100) =>
  `<div class="rij"><label>${label}</label><input type="range" min="${min}" max="${max}" value="${waarde}" data-set="${p}"><span class="waarde">${waarde}</span></div>`;

function tekenShow() {
  const s = S.show;
  const scenes = Object.keys(S.scenes);
  const palet = s.kleur.palet || [];
  const eigen = palet.filter(c => !KLEUREN.some(([k]) => k === c));
  const lookProfielen = Object.entries(S.profielen).filter(([pid, p]) => p.looks && p.looks.length
    && S.fixtures.some(f => f.profiel === pid));

  inhoud.innerHTML = `<div class="raster">
    <div class="blok">
      <h2>Algemeen</h2>
      <div class="rij" style="justify-content:space-between">
        <button data-bpm="-1">−</button><div class="bpm">${s.bpm}</div><button data-bpm="1">+</button>
        <button class="primair groot" id="tap" style="flex:1">TAP</button>
      </div>
      <div class="knoppen" style="grid-template-columns:1fr 1fr;margin-bottom:6px">
        <button data-set="beat.auto" data-val="true" class="${s.beat.auto ? 'aan' : ''}">♪ BPM AUTOMATISCH</button>
        <button data-set="beat.auto" data-val="false" class="${!s.beat.auto ? 'aan' : ''}">BPM HANDMATIG</button>
      </div>
      <p class="hint" id="luisterInfo">${luisterTekst(S.status)}</p>
      <div class="rij"><label>Snelle nummers</label>
        <button data-set="beat.snel_herkennen" data-val="${!s.beat.snel_herkennen}" class="${s.beat.snel_herkennen ? 'aan' : ''}" style="flex:1">
          ${s.beat.snel_herkennen ? 'Herkennen (×2 bij kick tussen de beats): AAN' : 'Herkennen: UIT (altijd het rustige tempo)'}</button></div>
      ${schuif('master', 'Master', s.master)}
      <div class="knoppen" style="grid-template-columns:1fr 1fr">
        <button data-set="blackout" data-val="${!s.blackout}" class="${s.blackout ? 'aan' : ''} gevaar">BLACKOUT${s.blackout ? ' (AAN)' : ''}</button>
        <button data-set="auto.aan" data-val="${!s.auto.aan}" class="${s.auto.aan ? 'aan' : ''}">AUTO-SHOW${s.auto.aan ? ' (AAN)' : ''}</button>
      </div>
      <div class="rij"><label>Auto wisselt elke</label>${keuzelijst('auto.elke', [[8, '8 beats'], [16, '16 beats'], [32, '32 beats'], [64, '64 beats']], s.auto.elke)}</div>
      ${schuif('strobe_hz', 'Strobe-snelheid (Hz)', s.strobe_hz, 2, 25)}
      <p class="hint">Auto-show kiest zelf steeds nieuwe kleuren, effecten en bewegingen. Zelf iets aanpassen kan altijd.</p>
      <h3>Energie van de muziek</h3>
      <div class="knoppen" style="grid-template-columns:1fr 1fr">
        <button data-set="energie.aan" data-val="${!s.energie.aan}" class="${s.energie.aan ? 'aan' : ''}">SHOW VOLGT ENERGIE${s.energie.aan ? ' (AAN)' : ''}</button>
        <button data-set="energie.flits_bij_drop" data-val="${!s.energie.flits_bij_drop}" class="${s.energie.flits_bij_drop ? 'aan' : ''}">FLITS BIJ DROP${s.energie.flits_bij_drop ? ' (AAN)' : ''}</button>
      </div>
      <div class="meter"><div id="eMeter"></div></div>
      <p class="hint" id="eTekst">–</p>
      <p class="hint">Rustig = langzame, kleine bewegingen en wat gedimd. Extreem = snel, groot en vol. Een drop geeft een korte witte flits.</p>
      <h3>Licht gelijk zetten met de muziek</h3>
      <p class="hint">Loopt het licht vóór op de muziek? Schuif naar rechts. Loopt het achter? Naar links.</p>
      ${schuif('beat.vertraging_spotify', 'Spotify (ms)', s.beat.vertraging_spotify, -300, 1200)}
      ${schuif('beat.vertraging_mpd', 'Mp3/MPD (ms)', s.beat.vertraging_mpd, -300, 1200)}
    </div>

    <div class="blok">
      <h2>Scènes</h2>
      ${scenes.length ? `<div class="knoppen">${scenes.map(n => `<button data-scene="${esc(n)}">${esc(n)}</button>`).join('')}</div>`
        : '<p class="hint">Nog geen scènes. Maak een mooie look en sla hem op via het tabblad Scènes.</p>'}
      <h2 style="margin-top:14px">Groepen</h2>
      ${Object.entries(s.groepen).map(([g, v]) => schuif('groepen.' + g, esc(g), v)).join('')}
    </div>

    <div class="blok">
      <h2>Kleur</h2>
      ${modusKnoppen('kleur.modus', KLEUR_MODI, s.kleur.modus)}
      <h3>Palet (volgorde = nummer)</h3>
      <div class="swatches">
        ${KLEUREN.concat(eigen.map(c => [c, 'eigen'])).map(([c, n]) => { const i = palet.indexOf(c);
          return `<div class="swatch ${i >= 0 ? 'aan' : ''}" style="background:${c}" title="${n}" data-palet="${c}">${i >= 0 ? `<span>${i + 1}</span>` : ''}</div>`; }).join('')}
        <label class="swatch" style="background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)" title="eigen kleur">
          <input type="color" id="eigenKleur" style="opacity:0;width:100%;height:100%;cursor:pointer"></label>
      </div>
      <div class="rij"><label>Snelheid</label>${keuzelijst('kleur.snelheid', SNELHEDEN, s.kleur.snelheid)}</div>
      ${schuif('kleur.spreiding', 'Spreiding', s.kleur.spreiding)}
    </div>

    <div class="blok">
      <h2>Intensiteit</h2>
      ${modusKnoppen('intensiteit.modus', INT_MODI, s.intensiteit.modus)}
      <div class="rij"><label>Snelheid</label>${keuzelijst('intensiteit.snelheid', SNELHEDEN, s.intensiteit.snelheid)}</div>
    </div>

    <div class="blok">
      <h2>Beweging (moving heads)</h2>
      ${modusKnoppen('beweging.modus', BEW_MODI, s.beweging.modus)}
      <div class="rij"><label>Eén ronde duurt</label>${keuzelijst('beweging.snelheid', RONDES, s.beweging.snelheid)}</div>
      ${schuif('beweging.grootte', 'Grootte', s.beweging.grootte)}
      ${schuif('beweging.spreiding', 'Spreiding', s.beweging.spreiding)}
      ${schuif('beweging.pan', 'Midden pan', s.beweging.pan)}
      ${schuif('beweging.tilt', 'Midden tilt', s.beweging.tilt)}
    </div>

    <div class="blok">
      <h2>Looks (laser e.d.)</h2>
      ${modusKnoppen('looks.modus', [['uit', 'Uit'], ['vast', 'Vaste look'], ['wissel', 'Automatisch wisselen']], s.looks.modus)}
      <div class="rij"><label>Wissel elke</label>${keuzelijst('looks.elke', [[4, '4 beats'], [8, '8 beats'], [16, '16 beats'], [32, '32 beats']], s.looks.elke)}</div>
      ${lookProfielen.length ? lookProfielen.map(([pid, p]) => `<h3>${esc(p.naam)}</h3><div class="knoppen">
          ${p.looks.map((l, i) => `<button data-look="${esc(pid)}" data-idx="${i}" class="${s.looks.modus === 'vast' && (s.looks.keuze[pid] || 0) === i ? 'aan' : ''}">${esc(l.naam)}</button>`).join('')}</div>`).join('')
        : '<p class="hint">Geen fixtures met looks. Looks maak je in het tabblad Profielen.</p>'}
    </div>

    <div class="blok">
      <h2>Raspberry Pi</h2>
      <p class="hint">Zet de Pi altijd hiermee uit voordat je de stroom eraf haalt. Zomaar de stekker eruit kan de SD-kaart beschadigen.</p>
      <div class="knoppen" style="grid-template-columns:1fr 1fr">
        <button id="piHerstart">Herstarten</button>
        <button class="gevaar" id="piUit">⏻ Pi uitzetten</button>
      </div>
    </div>
  </div>`;
  document.getElementById('piUit').onclick = () => systeem('uitzetten');
  document.getElementById('piHerstart').onclick = () => systeem('herstarten');
  document.getElementById('eigenKleur').addEventListener('change', e => {
    const p = (S.show.kleur.palet || []).concat([e.target.value]).slice(-8);
    zetShow('kleur.palet', p);
  });
}

let piGaatUit = false;
async function systeem(actie) {
  const vraag = actie === 'uitzetten'
    ? 'Pi uitzetten? Muziek en licht stoppen dan. Weer aanzetten = stekker eruit en er weer in.'
    : 'Pi herstarten? Muziek en licht zijn ongeveer een minuut weg.';
  if (!confirm(vraag)) return;
  try { await api('/api/systeem', { actie }); } catch (e) { return toast(e.message, true); }
  piGaatUit = true;
  inhoud.innerHTML = `<div class="blok" style="max-width:560px;margin:40px auto;text-align:center">
    <h2>${actie === 'uitzetten' ? 'De Pi gaat uit' : 'De Pi herstart'}</h2>
    ${actie === 'uitzetten'
      ? '<p style="font-size:16px">Wacht tot het <b>groene lampje</b> op de Pi niet meer knippert (ongeveer 20 seconden).<br><br>Daarna mag de stekker eruit.</p>'
      : '<p style="font-size:16px">Over ongeveer een minuut is alles terug. Herlaad dan deze pagina.</p>'}
  </div>`;
}

// ------------------------------------------------------------------ SCENES
function tekenScenes() {
  const namen = Object.keys(S.scenes);
  inhoud.innerHTML = `<div class="blok" style="max-width:640px">
    <h2>Huidige show opslaan als scène</h2>
    <div class="rij"><input id="sceneNaam" placeholder="naam, bijv. Rood-blauw chase" style="flex:1">
      <button class="primair" id="sceneOpslaan">Opslaan</button></div>
    <p class="hint">Een scène bewaart kleur, intensiteit, beweging en looks. Laden zet de auto-show uit.</p>
    <h2 style="margin-top:16px">Opgeslagen scènes</h2>
    ${namen.length ? namen.map(n => `<div class="rij"><span style="flex:1;font-weight:700">${esc(n)}</span>
      <button data-scene="${esc(n)}">Laden</button><button class="gevaar" data-scene-weg="${esc(n)}">Verwijderen</button></div>`).join('')
      : '<p class="hint">Nog geen scènes.</p>'}
  </div>`;
  document.getElementById('sceneOpslaan').onclick = async () => {
    const naam = document.getElementById('sceneNaam').value.trim();
    if (!naam) return toast('Geef de scène een naam', true);
    await api('/api/scene', { actie: 'opslaan', naam }); toast('Scène opgeslagen'); laad();
  };
}

// ------------------------------------------------------------------ FIXTURES
function adresBereik(f) {
  const p = S.profielen[f.profiel]; const n = p ? p.kanalen.length : 1;
  return [Number(f.adres), Number(f.adres) + n - 1];
}
function tekenFixtures() {
  const profOpties = pid => Object.entries(S.profielen).map(([id, p]) => `<option value="${esc(id)}" ${id === pid ? 'selected' : ''}>${esc(p.naam)}</option>`).join('');
  const overlap = i => { const [a, b] = adresBereik(F[i]);
    return F.some((g, j) => j !== i && (() => { const [c, d] = adresBereik(g); return a <= d && c <= b; })()); };
  inhoud.innerHTML = `
    <div class="rij" style="margin-top:0"><button class="primair" id="fxOpslaan">Wijzigingen opslaan</button>
      <button id="fxNieuw">+ Fixture toevoegen</button><span class="hint">Niet opgeslagen wijzigingen gaan verloren als je van tabblad wisselt.</span></div>
    ${F.map((f, i) => { const [a, b] = adresBereik(f); const p = S.profielen[f.profiel]; const heeftBew = p && p.kanalen.some(k => k.functie === 'pan' || k.functie === 'tilt');
      return `<div class="kaart">
      <div class="kop"><input data-i="${i}" data-k="naam" value="${esc(f.naam)}"><button class="gevaar" data-fx-weg="${i}">Verwijderen</button></div>
      <div class="velden">
        <label>Profiel<select data-i="${i}" data-k="profiel" data-herteken="1">${profOpties(f.profiel)}</select></label>
        <label>DMX-startadres<input type="number" min="1" max="512" data-i="${i}" data-k="adres" data-herteken="1" value="${f.adres}">
          <span class="${overlap(i) ? 'fout' : ''}">kanalen ${a}–${b}${overlap(i) ? ' ⚠ overlapt!' : ''}</span></label>
        <label>Groep<input data-i="${i}" data-k="groep" value="${esc(f.groep)}" list="groepLijst"></label>
        <label>Positie links→rechts (0–100)<input type="number" min="0" max="100" data-i="${i}" data-k="x" value="${f.x}"></label>
        <label class="check"><input type="checkbox" data-i="${i}" data-k="strobe" ${f.strobe ? 'checked' : ''}> Doet mee met STROBE</label>
        <label class="check"><input type="checkbox" data-i="${i}" data-k="effecten.kleur" ${f.effecten.kleur ? 'checked' : ''}> Volgt kleur-effect</label>
        <label class="check"><input type="checkbox" data-i="${i}" data-k="effecten.intensiteit" ${f.effecten.intensiteit ? 'checked' : ''}> Volgt intensiteit-effect</label>
        <label class="check"><input type="checkbox" data-i="${i}" data-k="effecten.beweging" ${f.effecten.beweging ? 'checked' : ''}> Volgt beweging</label>
        ${heeftBew ? `
        <label>Pan min / max<span><input type="number" min="0" max="255" data-i="${i}" data-k="pan_min" value="${f.pan_min}"> <input type="number" min="0" max="255" data-i="${i}" data-k="pan_max" value="${f.pan_max}"></span></label>
        <label>Tilt min / max<span><input type="number" min="0" max="255" data-i="${i}" data-k="tilt_min" value="${f.tilt_min}"> <input type="number" min="0" max="255" data-i="${i}" data-k="tilt_max" value="${f.tilt_max}"></span></label>
        <label class="check"><input type="checkbox" data-i="${i}" data-k="pan_omkeren" ${f.pan_omkeren ? 'checked' : ''}> Pan omkeren (gespiegeld)</label>` : ''}
      </div></div>`; }).join('')}
    <datalist id="groepLijst">${[...new Set(F.map(f => f.groep))].map(g => `<option value="${esc(g)}">`).join('')}</datalist>`;

  document.getElementById('fxNieuw').onclick = () => {
    const id = Math.max(0, ...F.map(f => f.id)) + 1;
    const vrij = Math.max(0, ...F.map(f => adresBereik(f)[1])) + 1;
    F.push({ id, naam: 'Nieuwe fixture ' + id, profiel: Object.keys(S.profielen)[0], adres: Math.min(512, vrij), groep: 'Overig', x: 50,
      strobe: true, effecten: { kleur: true, intensiteit: true, beweging: true }, pan_min: 0, pan_max: 255, tilt_min: 0, tilt_max: 255, pan_omkeren: false });
    tekenFixtures(); window.scrollTo(0, document.body.scrollHeight);
  };
  document.getElementById('fxOpslaan').onclick = async () => {
    try { await api('/api/fixtures', F); toast('Fixtures opgeslagen'); await laad(); F = kloon(S.fixtures); tekenFixtures(); }
    catch (e) { toast(e.message, true); }
  };
}

// ------------------------------------------------------------------ PROFIELEN
function tekenProfielen() {
  if (!P[profielKeuze]) profielKeuze = Object.keys(P)[0];
  const p = P[profielKeuze];
  const functies = Object.entries(S.functies);
  const inGebruik = pid => S.fixtures.filter(f => f.profiel === pid).map(f => f.naam);
  const lookTekst = l => Object.entries(l.waarden).map(([c, v]) => `${c}=${v}`).join(', ');
  inhoud.innerHTML = `
    <div class="rij" style="margin-top:0;flex-wrap:wrap">
      <select id="profKeuze" style="flex:1;min-width:200px">${Object.entries(P).map(([id, q]) => `<option value="${esc(id)}" ${id === profielKeuze ? 'selected' : ''}>${esc(q.naam)}</option>`).join('')}</select>
      <button id="profNieuw">+ Nieuw</button><button id="profKopie">Kopie maken</button><button class="gevaar" id="profWeg">Verwijderen</button>
      <button class="primair" id="profOpslaan">Alle profielen opslaan</button>
    </div>
    ${p ? `<div class="kaart">
      <div class="kop"><input id="profNaam" value="${esc(p.naam)}"></div>
      <p class="hint">Gebruikt door: ${esc(inGebruik(profielKeuze).join(', ') || 'geen fixtures')}. Zet per kanaal wat het doet (zie de handleiding van de lamp).
        <b>Standaard</b> = waarde als niets anders het kanaal bestuurt. <b>Strobe</b>/<b>Rook</b> = waarde zolang die knop ingedrukt is (leeg = automatisch).</p>
      <div class="scroll"><table>
        <tr><th style="width:36px">CH</th><th>Naam</th><th style="width:170px">Functie</th><th style="width:80px">Standaard</th><th style="width:80px">Strobe</th><th style="width:80px">Rook</th><th style="width:40px"></th></tr>
        ${p.kanalen.map((k, i) => `<tr><td><b>${i + 1}</b></td>
          <td><input data-ch="${i}" data-k="naam" value="${esc(k.naam)}"></td>
          <td><select data-ch="${i}" data-k="functie">${functies.map(([f, t]) => `<option value="${f}" ${f === k.functie ? 'selected' : ''}>${t}</option>`).join('')}</select></td>
          <td><input type="number" min="0" max="255" data-ch="${i}" data-k="standaard" value="${k.standaard ?? 0}"></td>
          <td><input type="number" min="0" max="255" data-ch="${i}" data-k="strobe" value="${k.strobe ?? ''}" placeholder="auto"></td>
          <td><input type="number" min="0" max="255" data-ch="${i}" data-k="rook" value="${k.rook ?? ''}" placeholder="auto"></td>
          <td><button class="gevaar" data-ch-weg="${i}">✕</button></td></tr>`).join('')}
      </table></div>
      <div class="rij"><button id="chNieuw">+ Kanaal</button><span class="hint">${p.kanalen.length} kanalen</span></div>

      <h3>Looks</h3>
      <p class="hint">Een look zet een paar kanalen op een vaste waarde, bijvoorbeeld een laserpatroon. Schrijf <b>kanaal=waarde</b>, gescheiden door komma's, bijv. <code>19=208, 20=80</code>.
        Op het tabblad Show kies je een vaste look of laat je ze automatisch wisselen.</p>
      <table>${p.looks.map((l, i) => `<tr><td style="width:40%"><input data-look-i="${i}" data-k="naam" value="${esc(l.naam)}"></td>
        <td><input data-look-i="${i}" data-k="waarden" value="${esc(lookTekst(l))}"></td>
        <td style="width:40px"><button class="gevaar" data-look-weg="${i}">✕</button></td></tr>`).join('')}</table>
      <div class="rij"><button id="lookNieuw">+ Look</button></div>
    </div>` : '<p class="hint">Geen profielen. Maak er een aan met + Nieuw.</p>'}`;

  const kies = document.getElementById('profKeuze');
  kies.onchange = () => { profielKeuze = kies.value; tekenProfielen(); };
  document.getElementById('profNieuw').onclick = () => {
    const id = 'p' + Date.now().toString(36);
    P[id] = { naam: 'Nieuw profiel', kanalen: [{ naam: 'Dimmer', functie: 'dimmer', standaard: 0, strobe: null, rook: null }], looks: [] };
    profielKeuze = id; tekenProfielen();
  };
  document.getElementById('profKopie').onclick = () => {
    if (!p) return;
    const id = 'p' + Date.now().toString(36);
    P[id] = kloon(p); P[id].naam = p.naam + ' (kopie)'; profielKeuze = id; tekenProfielen();
  };
  document.getElementById('profWeg').onclick = () => {
    if (!p) return;
    if (inGebruik(profielKeuze).length) return toast('Dit profiel is nog in gebruik door: ' + inGebruik(profielKeuze).join(', '), true);
    if (!confirm(`Profiel "${p.naam}" verwijderen?`)) return;
    delete P[profielKeuze]; profielKeuze = null; tekenProfielen();
  };
  document.getElementById('profOpslaan').onclick = async () => {
    try { await api('/api/profielen', P); toast('Profielen opgeslagen'); await laad(); P = kloon(S.profielen); tekenProfielen(); }
    catch (e) { toast(e.message, true); }
  };
  if (!p) return;
  document.getElementById('profNaam').oninput = e => p.naam = e.target.value;
  document.getElementById('chNieuw').onclick = () => { p.kanalen.push({ naam: 'Kanaal ' + (p.kanalen.length + 1), functie: 'fixed', standaard: 0, strobe: null, rook: null }); tekenProfielen(); };
  document.getElementById('lookNieuw').onclick = () => { p.looks.push({ naam: 'Nieuwe look', waarden: {} }); tekenProfielen(); };
}

function leesLook(tekst) {
  const w = {};
  tekst.split(/[,;\s]+/).filter(Boolean).forEach(deel => {
    const m = deel.match(/^(\d+)=(\d+)$/);
    if (m) w[m[1]] = Math.min(255, Number(m[2]));
  });
  return w;
}

// ------------------------------------------------------------------ TEST
let testTimer = null, liveTimer = null;
function tekenTest() {
  if (testFixture === null || !S.fixtures.some(f => f.id === testFixture)) testFixture = S.fixtures.length ? S.fixtures[0].id : null;
  const f = S.fixtures.find(x => x.id === testFixture);
  const p = f && S.profielen[f.profiel];
  inhoud.innerHTML = `<div class="blok" style="max-width:820px">
    <h2>Kanalen testen</h2>
    <p class="hint">Zolang je hier aan een schuif zit, krijgt deze fixture precies deze waarden (de rest van de show loopt door).
      Handig om uit te zoeken welk kanaal wat doet. Blauw = wat de Pi nu echt verstuurt.</p>
    <div class="rij"><select id="testKeuze" style="flex:1">${S.fixtures.map(x => `<option value="${x.id}" ${x.id === testFixture ? 'selected' : ''}>${esc(x.naam)} (adres ${x.adres})</option>`).join('')}</select></div>
    <div class="rij"><button id="testStandaard">Standaardwaarden</button><button id="testNul">Alles 0</button><button class="gevaar" id="testStop">Test stoppen</button></div>
    <div id="testRijen">${p ? p.kanalen.map((k, i) => `<div class="testrij">
      <span class="naam">CH${i + 1} · ${Number(f.adres) + i} · ${esc(k.naam)}</span>
      <input type="range" min="0" max="255" value="${testWaarden[i] ?? k.standaard ?? 0}" data-test="${i}">
      <input type="number" min="0" max="255" value="${testWaarden[i] ?? k.standaard ?? 0}" data-test-nr="${i}">
      <span class="live" id="live${i}">–</span></div>`).join('') : '<p class="hint">Geen fixtures.</p>'}</div>
  </div>`;
  document.getElementById('testKeuze').onchange = e => { stopTest(); testFixture = Number(e.target.value); testWaarden = []; tekenTest(); };
  document.getElementById('testStandaard').onclick = () => { testWaarden = p.kanalen.map(k => k.standaard || 0); stuurTest(); tekenTest(); };
  document.getElementById('testNul').onclick = () => { testWaarden = p.kanalen.map(() => 0); stuurTest(); tekenTest(); };
  document.getElementById('testStop').onclick = () => { stopTest(); toast('Test gestopt'); };
  clearInterval(liveTimer);
  liveTimer = setInterval(async () => {
    if (tab !== 'test' || !f) return;
    try {
      const frame = await api('/api/frame');
      p.kanalen.forEach((k, i) => { const el = document.getElementById('live' + i); if (el) el.textContent = frame[Number(f.adres) - 1 + i] ?? '–'; });
    } catch (e) {}
  }, 400);
}
function stuurTest() {
  const f = S.fixtures.find(x => x.id === testFixture); if (!f) return;
  const p = S.profielen[f.profiel];
  const w = p.kanalen.map((k, i) => testWaarden[i] ?? k.standaard ?? 0);
  api('/api/test', { fixture: testFixture, waarden: w }).catch(() => {});
  clearInterval(testTimer);
  testTimer = setInterval(() => api('/api/test', { fixture: testFixture, waarden: w }).catch(() => {}), 2000);
}
function stopTest() { clearInterval(testTimer); testTimer = null; testWaarden = []; api('/api/test', { fixture: null }).catch(() => {}); }

// ------------------------------------------------------------------ gebeurtenissen
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  if (tab === 'test' && b.dataset.tab !== 'test') { stopTest(); clearInterval(liveTimer); }
  tab = b.dataset.tab;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('actief', x === b));
  if (tab === 'fixtures') { F = kloon(S.fixtures); tekenFixtures(); }
  else if (tab === 'profielen') { P = kloon(S.profielen); tekenProfielen(); }
  else if (tab === 'test') tekenTest();
  else laad();
});

let throttle = 0;
inhoud.addEventListener('click', async e => {
  const t = e.target;
  const b = t.closest('button, .swatch'); if (!b) return;
  if (b.dataset.set !== undefined && b.dataset.val !== undefined) {
    let v = b.dataset.val; try { v = JSON.parse(v); } catch (x) {}
    return zetShow(b.dataset.set, v);
  }
  if (b.id === 'tap') { api('/api/tap', {}).then(laad); return; }
  if (b.dataset.bpm) return zetShow('bpm', Math.round(S.show.bpm) + Number(b.dataset.bpm));
  if (b.dataset.palet) {
    const c = b.dataset.palet; let p = [...(S.show.kleur.palet || [])];
    p = p.includes(c) ? p.filter(x => x !== c) : p.concat([c]);
    if (!p.length) return toast('Minimaal één kleur nodig', true);
    return zetShow('kleur.palet', p);
  }
  if (b.dataset.look !== undefined) {
    try { await api('/api/show', { looks: { modus: 'vast', keuze: { [b.dataset.look]: Number(b.dataset.idx) } } }); } catch (x) { toast(x.message, true); }
    return laad();
  }
  if (b.dataset.scene !== undefined) { await api('/api/scene', { actie: 'laden', naam: b.dataset.scene }); toast('Scène geladen: ' + b.dataset.scene); return laad(); }
  if (b.dataset.sceneWeg !== undefined) {
    if (!confirm(`Scène "${b.dataset.sceneWeg}" verwijderen?`)) return;
    await api('/api/scene', { actie: 'verwijderen', naam: b.dataset.sceneWeg }); return laad();
  }
  if (b.dataset.fxWeg !== undefined) {
    const f = F[Number(b.dataset.fxWeg)];
    if (confirm(`"${f.naam}" verwijderen? (pas definitief na Opslaan)`)) { F.splice(Number(b.dataset.fxWeg), 1); tekenFixtures(); }
    return;
  }
  if (b.dataset.chWeg !== undefined) { P[profielKeuze].kanalen.splice(Number(b.dataset.chWeg), 1); return tekenProfielen(); }
  if (b.dataset.lookWeg !== undefined) { P[profielKeuze].looks.splice(Number(b.dataset.lookWeg), 1); return tekenProfielen(); }
});

inhoud.addEventListener('input', e => {
  const el = e.target;
  // schuiven op het Show-tabblad: live meesturen
  if (el.type === 'range' && el.dataset.set) {
    const w = el.nextElementSibling; if (w) w.textContent = el.value;
    const nu = Date.now();
    if (nu - throttle > 80) { throttle = nu; zetShow(el.dataset.set, Number(el.value), false); }
    return;
  }
  // fixtures bewerken
  if (el.dataset.i !== undefined && F) {
    const f = F[Number(el.dataset.i)], k = el.dataset.k;
    const v = el.type === 'checkbox' ? el.checked : (el.type === 'number' ? Number(el.value) : el.value);
    if (k.startsWith('effecten.')) f.effecten[k.split('.')[1]] = v; else f[k] = v;
    return;
  }
  // profielen bewerken
  if (el.dataset.ch !== undefined && P) {
    const k = P[profielKeuze].kanalen[Number(el.dataset.ch)];
    const v = el.dataset.k === 'naam' || el.dataset.k === 'functie' ? el.value
      : (el.value === '' && el.dataset.k !== 'standaard' ? null : Math.max(0, Math.min(255, Number(el.value) || 0)));
    k[el.dataset.k] = v;
    return;
  }
  if (el.dataset.lookI !== undefined && P) {
    const l = P[profielKeuze].looks[Number(el.dataset.lookI)];
    if (el.dataset.k === 'naam') l.naam = el.value; else l.waarden = leesLook(el.value);
    return;
  }
  // test-schuiven
  if (el.dataset.test !== undefined || el.dataset.testNr !== undefined) {
    const i = Number(el.dataset.test ?? el.dataset.testNr), v = Math.max(0, Math.min(255, Number(el.value) || 0));
    testWaarden[i] = v;
    const rij = el.closest('.testrij');
    rij.querySelector('[data-test]').value = v;
    if (el.dataset.test !== undefined) rij.querySelector('[data-test-nr]').value = v;
    const f = S.fixtures.find(x => x.id === testFixture);
    S.profielen[f.profiel].kanalen.forEach((k, j) => { if (testWaarden[j] === undefined) testWaarden[j] = k.standaard || 0; });
    const nu = Date.now();
    if (nu - throttle > 60) { throttle = nu; stuurTest(); }
  }
});

inhoud.addEventListener('change', e => {
  const el = e.target;
  if (el.tagName === 'SELECT' && el.dataset.set) return zetShow(el.dataset.set, el.dataset.num ? Number(el.value) : el.value);
  if (el.type === 'range' && el.dataset.set) { zetShow(el.dataset.set, Number(el.value)); return; }
  if (el.dataset.herteken && F) tekenFixtures();
  if (el.dataset.test !== undefined || el.dataset.testNr !== undefined) stuurTest();
  if (el.dataset.lookI !== undefined && P && el.dataset.k === 'waarden') tekenProfielen();
});
inhoud.addEventListener('pointerdown', e => { if (e.target.type === 'range') bezig = true; });
window.addEventListener('pointerup', () => { if (bezig) { bezig = false; setTimeout(laad, 150); } });

// ------------------------------------------------------------------ start
laad();
setInterval(() => { if (tab === 'show' || tab === 'scenes') laad(); }, 1500);
setInterval(() => { if (!document.hidden) pollStatus(); }, 250);   // energiemeter en statusbalk: net zo vaak als de Pi meet
requestAnimationFrame(beatLamp);
</script>
</body>
</html>
